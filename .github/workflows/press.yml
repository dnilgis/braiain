name: Press screenshots (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm i --no-save playwright@1.48.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node tmp/press.js
          git config user.name "brAIAIn"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add press && git commit -qm "Retake press screenshots" && git pull --rebase && git push
