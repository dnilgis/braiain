name: Train brAIAIn

# Checks Stripe for new paid sentences, retrains every model version,
# and commits the result. GitHub Pages then republishes the site.

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # every 10 minutes, off the busy :00 slots (GitHub can still run late)
  push:
    branches: [main]
    paths:
      - "data/removed.txt"
      - "data/blocklist.txt"
      - "data/genesis.txt"
      - "data/approved.txt"
      - "data/declined.txt"
      - "data/approvals/**"
      - "data/declines/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest commit, including the bot's own

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Train
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PAYMENT_LINK: ${{ vars.STRIPE_PAYMENT_LINK }}
          REQUIRE_APPROVAL: ${{ vars.REQUIRE_APPROVAL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_EMAIL_TO: ${{ secrets.REVIEW_EMAIL_TO }}
        run: python scripts/train.py

      - name: Share pages, release cards, daily answer
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          python scripts/cards.py

      - name: Commit if anything changed
        run: |
          git config user.name "brAIAIn"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models v daily
          # status.json changes every run; only commit it alone once a day to keep history small
          # The review-queue count is public, so commit status.json when it changes.
          queue_changed=$(python3 -c "import json,subprocess;old=json.loads(subprocess.run(['git','show','HEAD:data/status.json'],capture_output=True,text=True).stdout or '{}');new=json.load(open('data/status.json'));print('yes' if (old.get('pending_review'),old.get('review_mode'))!=(new.get('pending_review'),new.get('review_mode')) else 'no')")
          if git diff --cached --quiet -- . ':(exclude)data/status.json' && [ "$queue_changed" = "no" ]; then
            if [ "$(date -u +%H%M | cut -c1-3)" = "120" ]; then
              git commit -m "Daily heartbeat" && git pull --rebase --autostash && git push
            fi
            echo "No new training data."
          else
            git commit -m "Training run $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash && git push
          fi

      - name: Announce on X and Bluesky, sync Hugging Face
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REVIEW_EMAIL_TO: ${{ secrets.REVIEW_EMAIL_TO }}
        run: |
          if [ -n "$HF_TOKEN" ]; then pip install -q "huggingface_hub==0.26.2"; fi
          # A new version was just pushed: give GitHub Pages a minute to publish it before linking to it.
          if git log -1 --pretty=%s | grep -q "^Training run"; then sleep 60; fi
          python scripts/announce.py
          git reset -q   # leave status.json to the once-a-day heartbeat
          git add data/announce.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Announce $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase --autostash && git push
          fi
