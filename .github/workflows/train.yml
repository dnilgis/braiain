name: Train brAIAIn

# Checks Stripe for new paid sentences, retrains every model version,
# and commits the result. GitHub Pages then republishes the site.

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # every 10 minutes, off the busy :00 slots (GitHub can still run late)
  push:
    branches: [main]
    paths:
      - "data/removed.txt"
      - "data/blocklist.txt"
      - "data/genesis.txt"
      - "data/approved.txt"
      - "data/declined.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest commit, including the bot's own

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Train
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PAYMENT_LINK: ${{ vars.STRIPE_PAYMENT_LINK }}
          REQUIRE_APPROVAL: ${{ vars.REQUIRE_APPROVAL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/train.py

      - name: Commit if anything changed
        run: |
          git config user.name "brAIAIn"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models
          # status.json changes every run; only commit it alone once a day to keep history small
          # The review-queue count is public, so commit status.json when it changes.
          queue_changed=$(python3 -c "import json,subprocess;old=json.loads(subprocess.run(['git','show','HEAD:data/status.json'],capture_output=True,text=True).stdout or '{}');new=json.load(open('data/status.json'));print('yes' if (old.get('pending_review'),old.get('review_mode'))!=(new.get('pending_review'),new.get('review_mode')) else 'no')")
          if git diff --cached --quiet -- . ':(exclude)data/status.json' && [ "$queue_changed" = "no" ]; then
            if [ "$(date -u +%H%M | cut -c1-3)" = "120" ]; then
              git commit -m "Daily heartbeat" && git pull --rebase && git push
            fi
            echo "No new training data."
          else
            git commit -m "Training run $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase && git push
          fi
