name: Board photo candidates (temporary)
on:
  push:
    branches: [photo-candidates]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: photo-candidates }
      - run: pip install -q pillow && python tmp/fetch.py
      - run: |
          git config user.name "brAIAIn"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/cand && git commit -qm "candidates" && git push origin photo-candidates
