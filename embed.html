<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>BRAIAIN embed</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#14130f;color:#e8e2d4;font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;height:100vh;display:flex;align-items:center;overflow:hidden}
a{color:inherit;text-decoration:none}
.card{width:100%;padding:12px 16px;border-top:3px solid #e8e2d4}
.v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.v .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#d9482b;margin-left:5px;vertical-align:4px}
.l{font-size:11.5px;color:#b4ae9f;font-weight:600;margin-top:2px}
.s{font-size:9.5px;color:#817c6f;margin-top:3px}
.s b{color:#e8e2d4;font-weight:700}
</style>
</head>
<body>
<a class="card" href="https://www.braiain.com/" target="_blank" rel="noopener" id="card">
  <div class="v num"><span id="v">—</span><span class="dot" id="dot" hidden></span></div>
  <div class="l" id="l">BRAIAIN</div>
  <div class="s"><span id="s"></span> · <b>braiain.com</b></div>
</a>
<script>
(function(){
  // Baked at re-base 2026-10-20. Live counters are measured paces (see braiain.com/methodology.html#wall).
  var C = {
    spend:  {rate:16281.93, unit:"$", l:"spent by Microsoft, Alphabet, Amazon & Meta building AI since you opened", s:"$16,282/s, filings, yr to Jun 2026 · Oct 2026"},
    flow:   {rate:25081.89, unit:"$", l:"combined AI buildout flow since you opened (overlapping)", s:"$25,082/s · big-4 capex + NVIDIA DC revenue · filings"},
    vc:     {rate:12832.13, unit:"$", l:"of venture capital into AI since you opened", s:"$12,832/s at Q3 2026 pace · Crunchbase"},
    users:  {rate:16.225,   unit:"",  l:"new weekly ChatGPT users since you opened", s:"16.2/s, Feb–Sep 2026 pace run forward · OpenAI"},
    kwh:    {rate:13151,    unit:"",  l:"kWh used by world data centers since you opened", s:"IEA 2024 rate, all workloads"},
    index:  {fixed:"647.7", l:"BRAIAIN Buildout Index · Q1 2022 = 100 · ~55%/yr", s:"big-4 capex + NVIDIA DC revenue · SEC filings · Q2 2026"},
    flared: {fixed:"173 MMcf/d", l:"of gas still flared in North Dakota at 95.3% capture", s:"ND Industrial Commission · Jul 2026"}
  };
  var q = (location.search.match(/[?&]c=([a-z]+)/)||[])[1] || "spend";
  var c = C[q] || C.spend;
  var v = document.getElementById('v'), l = document.getElementById('l'), s = document.getElementById('s'), dot = document.getElementById('dot');
  l.textContent = c.l; s.textContent = c.s;
  function fmt(n){ return Math.floor(n).toLocaleString('en-US'); }
  if (c.fixed) { v.textContent = c.fixed; return; }
  dot.hidden = false;
  var reduced = false;
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
  var t0 = performance.now();
  function tick(){ v.textContent = c.unit + fmt(((performance.now()-t0)/1000) * c.rate); }
  if (reduced) { v.textContent = c.unit + "0"; } else { tick(); setInterval(tick, 1000); }
})();
</script>
</body>
</html>
